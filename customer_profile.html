<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - PharmaCare</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #6b7280;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #10b981;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo i {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }

        .logo span {
            font-size: 1.5rem;
            font-weight: 700;
            color: #10b981;
        }

        /* Main Container */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .page-title {
            font-size: 1.75rem;
            margin-bottom: 24px;
            color: #1e293b;
        }

        /* Form Card */
        .form-card {
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 24px;
        }

        .form-card h3 {
            font-size: 1.125rem;
            margin-bottom: 24px;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .form-card h3 i {
            color: #10b981;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #374151;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 0.875rem;
            transition: all 0.2s;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        .form-group input:disabled {
            background: #f3f4f6;
            cursor: not-allowed;
        }

        .form-group small {
            display: block;
            margin-top: 6px;
            color: #6b7280;
            font-size: 0.75rem;
        }

        /* Buttons */
        .btn {
            padding: 12px 32px;
            border-radius: 10px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-outline {
            background: transparent;
            color: #6b7280;
            border: 2px solid #e5e7eb;
        }

        .btn-outline:hover {
            border-color: #10b981;
            color: #10b981;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }

        /* Alert */
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 0.875rem;
            display: none;
        }

        .alert.error {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .alert.success {
            background: #f0fdf4;
            color: #16a34a;
            border: 1px solid #bbf7d0;
        }

        .alert.show {
            display: block;
        }

        /* Avatar Upload */
        .avatar-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .avatar-preview {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-bottom: 16px;
        }

        @media (max-width: 640px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .form-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <a href="customer_store.html" class="back-link">
                <i class="fas fa-arrow-left"></i>
                Back to Store
            </a>
            <a href="customer_store.html" class="logo">
                <i class="fas fa-pills"></i>
                <span>PharmaCare</span>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container">
        <h1 class="page-title">Edit Profile</h1>

        <div class="alert error" id="errorAlert"></div>
        <div class="alert success" id="successAlert"></div>

        <!-- Personal Information -->
        <div class="form-card">
            <h3><i class="fas fa-user-circle"></i> Personal Information</h3>
            
            <div class="avatar-section">
                <img id="avatarPreview" src="" alt="Profile" class="avatar-preview">
            </div>

            <form id="profileForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" id="firstName" required>
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" id="lastName" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="phone" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" id="dateOfBirth">
                </div>

                <div class="form-group">
                    <label>Address</label>
                    <textarea id="address" rows="3" placeholder="Enter your full address"></textarea>
                </div>

                <div class="form-group">
                    <label>Allergies / Medical Notes</label>
                    <textarea id="allergies" rows="2" placeholder="List any allergies or important medical information"></textarea>
                    <small>This information helps us serve you better</small>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="saveBtn">
                        <i class="fas fa-save"></i> Save Changes
                    </button>
                    <a href="customer_dashboard.html" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>

        <!-- Change Password -->
        <div class="form-card">
            <h3><i class="fas fa-lock"></i> Change Password</h3>
            
            <form id="passwordForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Current Password</label>
                        <input type="password" id="currentPassword" placeholder="Enter current password">
                    </div>
                    <div class="form-group">
                        <label>New Password</label>
                        <input type="password" id="newPassword" placeholder="Enter new password" minlength="6">
                        <small>Minimum 6 characters</small>
                    </div>
                </div>

                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm new password">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="passwordBtn">
                        <i class="fas fa-key"></i> Update Password
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'api/';

        // Check authentication
        const customerStr = sessionStorage.getItem('customer');
        if (!customerStr) {
            window.location.href = 'customer_login.html';
        }
        const customer = JSON.parse(customerStr);

        // Load customer data
        async function loadCustomerData() {
            try {
                const response = await fetch(API_URL + 'customer_auth.php?action=check');
                const result = await response.json();
                
                if (result.success) {
                    const data = result.data;
                    
                    // Fill form
                    document.getElementById('firstName').value = data.first_name || '';
                    document.getElementById('lastName').value = data.last_name || '';
                    document.getElementById('email').value = data.email || '';
                    document.getElementById('phone').value = data.phone || '';
                    document.getElementById('address').value = data.address || '';
                    document.getElementById('dateOfBirth').value = data.date_of_birth || '';
                    document.getElementById('allergies').value = data.allergies || '';
                    
                    // Update avatar
                    const fullName = `${data.first_name} ${data.last_name}`;
                    const avatarUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(fullName)}&background=10b981&color=fff&size=256`;
                    document.getElementById('avatarPreview').src = avatarUrl;
                    
                    // Update session
                    sessionStorage.setItem('customer', JSON.stringify(data));
                }
            } catch (error) {
                console.error('Failed to load customer data:', error);
            }
        }

        // Show alert
        function showAlert(type, message) {
            const alertDiv = document.getElementById(type + 'Alert');
            alertDiv.textContent = message;
            alertDiv.classList.add('show');
            
            setTimeout(() => {
                alertDiv.classList.remove('show');
            }, 5000);
        }

        // Update profile
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                first_name: document.getElementById('firstName').value,
                last_name: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                date_of_birth: document.getElementById('dateOfBirth').value,
                allergies: document.getElementById('allergies').value
            };
            
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            
            try {
                const response = await fetch(API_URL + 'customer_auth.php?action=update', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showAlert('success', 'Profile updated successfully!');
                    // Update avatar
                    const fullName = `${data.first_name} ${data.last_name}`;
                    document.getElementById('avatarPreview').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(fullName)}&background=10b981&color=fff&size=256`;
                    // Update session
                    customer.first_name = data.first_name;
                    customer.last_name = data.last_name;
                    customer.email = data.email;
                    customer.phone = data.phone;
                    sessionStorage.setItem('customer', JSON.stringify(customer));
                } else {
                    showAlert('error', result.message || 'Failed to update profile');
                }
            } catch (error) {
                showAlert('error', 'Connection error. Please try again.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> Save Changes';
            }
        });

        // Change password
        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const currentPass = document.getElementById('currentPassword').value;
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;
            
            if (!currentPass || !newPass) {
                showAlert('error', 'Please fill in all password fields');
                return;
            }
            
            if (newPass !== confirmPass) {
                showAlert('error', 'New passwords do not match');
                return;
            }
            
            if (newPass.length < 6) {
                showAlert('error', 'Password must be at least 6 characters');
                return;
            }
            
            const btn = document.getElementById('passwordBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';
            
            try {
                const response = await fetch(API_URL + 'customer_auth.php?action=update', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        current_password: currentPass,
                        password: newPass 
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showAlert('success', 'Password updated successfully!');
                    document.getElementById('passwordForm').reset();
                } else {
                    showAlert('error', result.message || 'Failed to update password');
                }
            } catch (error) {
                showAlert('error', 'Connection error. Please try again.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-key"></i> Update Password';
            }
        });

        // Initialize
        loadCustomerData();
    </script>
</body>
</html>
